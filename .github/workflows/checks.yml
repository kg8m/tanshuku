name: Checks

on:
  push:
    branches:
      - main
      - "*-stable"
  pull_request:

jobs:
  test:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        ruby-version:
          - "3.2"
          - "3.3"
          - "3.4"
          - "4.0"
        rails-version:
          - "~> 7.0.0"
          - "~> 7.1.0"
          - "~> 7.2.0"
          - "~> 8.0.0"
          - "~> 8.1.0"
        addressable-version:
          - "~> 2.4.0"
          - "~> 2.5.0"
          - "~> 2.6.0"
          - "~> 2.7.0"
          - "~> 2.8.0"
          - "~> 2.9.0"
    runs-on: ubuntu-latest
    env:
      # Ignore `Gemfile.lock` on CI.
      BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile.ci

      RAILS_VERSION: ${{ matrix.rails-version }}
      ADDRESSABLE_VERSION: ${{ matrix.addressable-version }}
    name: >-
      Test --
      Ruby ${{ matrix.ruby-version }} &&
      Rails ${{ matrix.rails-version }} &&
      Addressable ${{ matrix.addressable-version }}
    steps:
      - uses: actions/checkout@v7.0.1

      # https://github.com/ruby/setup-ruby
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.338.0
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      - name: Setup DB
        run: bin/rails db:migrate
        timeout-minutes: 5

      - name: RSpec
        run: bundle exec rake spec
        timeout-minutes: 5

  lint:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    name: Lint
    steps:
      - uses: actions/checkout@v7.0.1

      # https://github.com/ruby/setup-ruby
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.338.0
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: RuboCop
        run: bundle exec rake rubocop
        timeout-minutes: 5

  typecheck:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    name: Typecheck
    steps:
      - uses: actions/checkout@v7.0.1

      # https://github.com/ruby/setup-ruby
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.338.0
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Prepare for typecheck
        run: bundle exec rake steep:prepare
        timeout-minutes: 5

      - name: Run typecheck
        run: bundle exec rake steep:check
        timeout-minutes: 5

  documentation-check:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    name: Documentation syntax check
    steps:
      - uses: actions/checkout@v7.0.1

      # https://github.com/ruby/setup-ruby
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.338.0
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Check YARD docs
        run: bundle exec rake yard:check
        timeout-minutes: 5

  actions-lock-verification:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    name: Verify actions lockfile
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # https://github.com/github/gh-actions-lock
      # Don’t pin the extension version because neither `.github/workflows/actions.lock` nor Dependabot updates it, and
      # its checks should follow the runner’s ones.
      - name: Install gh-actions-lock
        run: gh extension install github/gh-actions-lock
        env:
          GH_TOKEN: ${{ github.token }}
        timeout-minutes: 5

      # Report a stale lockfile in pull request checks because runs blocked by the “Require lockfile” policy only
      # result in `startup_failure`, which doesn’t appear in pull request checks.
      - name: Verify actions lockfile
        run: gh actions-lock --verify
        env:
          GH_TOKEN: ${{ github.token }}
        timeout-minutes: 5
