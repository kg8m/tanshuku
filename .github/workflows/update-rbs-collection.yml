name: Update RBS collection

on:
  schedule:
    # Run every Saturday at 10:00 JST.
    - cron: "0 1 * * 6"

  # For debug
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Run gems’ code in a job without the GitHub App’s secrets.
  update-rbs-collection:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # https://github.com/ruby/setup-ruby
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.338.0
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Update RBS collection
        run: |
          mkdir "${RUNNER_TEMP}/rbs-collection"
          bundle exec rbs collection update > "${RUNNER_TEMP}/rbs-collection/output.txt"
          cp rbs_collection.lock.yaml "${RUNNER_TEMP}/rbs-collection/"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: rbs-collection
          path: ${{ runner.temp }}/rbs-collection/
          if-no-files-found: error
          retention-days: 1

  create-pull-request:
    needs: update-rbs-collection
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8.0.2
        with:
          name: rbs-collection
          path: ${{ runner.temp }}/rbs-collection/

      - name: Apply the updated lockfile
        run: cp "${RUNNER_TEMP}/rbs-collection/rbs_collection.lock.yaml" .

      - name: Read output.txt
        id: read-output
        uses: juliangruber/read-file-action@v1.1.8
        with:
          path: ${{ runner.temp }}/rbs-collection/output.txt

      # https://github.com/actions/create-github-app-token
      - name: Generate token
        id: generate_token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ secrets.KG8M_BOT_CLIENT_ID }}
          private-key: ${{ secrets.KG8M_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # https://github.com/peter-evans/create-pull-request
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8.1.2
        with:
          # Use my GitHub app’s temporary token because the default `GITHUB_TOKEN` prevents other workflows from being
          # triggered when a pull request is created.
          # cf. https://docs.github.com/en/actions/using-workflows/triggering-a-workflow#triggering-a-workflow-from-a-workflow
          token: ${{ steps.generate_token.outputs.token }}

          commit-message: |
            Update RBS collection

            ```sh
            $ bundle exec rbs collection update
            ```

            ```
            ${{ steps.read-output.outputs.content }}
            ```
          branch: update-rbs-collection
          delete-branch: true
          title: Update RBS collection
          body: |
            ```sh
            $ bundle exec rbs collection update
            ```

            ```
            ${{ steps.read-output.outputs.content }}
            ```
          labels: dependencies,dev-dependencies
          assignees: kg8m
