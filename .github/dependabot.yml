# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: "10:00"
      timezone: Asia/Tokyo
    # Wait for new releases to settle before updating `.github/workflows/actions.lock`.
    cooldown:
      default-days: 7
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: "10:00"
      timezone: Asia/Tokyo
    # Wait for new releases to settle before updating because updates of development dependencies are merged
    # automatically. Security updates aren’t delayed.
    cooldown:
      default-days: 7
    groups:
      rails:
        patterns:
          - "action*"
          - "active*"
          - "rails"
          - "railties"
      rspec:
        patterns:
          - "rspec*"
      rubocop:
        patterns:
          - "rubocop*"
    allow:
      - dependency-type: all
    open-pull-requests-limit: 15
